name: iOS Live Activity Signed Build

on:
  push:
    branches: [ "codex/customer-live-activity-sync-20261018" ]
    paths:
      - '.github/workflows/ios-live-activity-build.yml'
  workflow_dispatch:
    inputs:
      build_name:
        description: iOS version
        required: true
        default: '2.0.6'
      build_number:
        description: iOS build number base (run number and attempt make each artifact unique)
        required: true
        default: '56'

permissions:
  contents: read

jobs:
  build_signed_artifact:
    if: github.ref == 'refs/heads/codex/customer-live-activity-sync-20261018'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve build metadata
        env:
          REQUESTED_BUILD_NAME: ${{ inputs.build_name || '2.0.6' }}
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number || '56' }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REQUESTED_BUILD_NUMBER" =~ ^[0-9]{1,4}$ ]]
          BUILD_BASE=$((10#$REQUESTED_BUILD_NUMBER + GITHUB_RUN_NUMBER))
          test "$BUILD_BASE" -le 9999
          test "$GITHUB_RUN_ATTEMPT" -le 99
          echo "BUILD_NAME=$REQUESTED_BUILD_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_BASE.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Install Apple Distribution certificate and provisioning profiles
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MAIN_PROFILE_BASE64: ${{ secrets.IOS_MAIN_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          : "${IOS_P12_BASE64:?Missing IOS_P12_BASE64}"
          : "${IOS_P12_PASSWORD:?Missing IOS_P12_PASSWORD}"
          : "${IOS_MAIN_PROFILE_BASE64:?Missing IOS_MAIN_PROFILE_BASE64}"
          : "${IOS_EXTENSION_PROFILE_BASE64:?Missing IOS_EXTENSION_PROFILE_BASE64}"

          CERT_PATH="$RUNNER_TEMP/fasakhansta_distribution.p12"
          MAIN_PROFILE="$RUNNER_TEMP/main.mobileprovision"
          EXT_PROFILE="$RUNNER_TEMP/extension.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/fasakhansta-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_MAIN_PROFILE_BASE64" | base64 --decode > "$MAIN_PROFILE"
          printf '%s' "$IOS_EXTENSION_PROFILE_BASE64" | base64 --decode > "$EXT_PROFILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$PROFILE_DIR"
          security cms -D -i "$MAIN_PROFILE" > "$RUNNER_TEMP/main-profile.plist"
          security cms -D -i "$EXT_PROFILE" > "$RUNNER_TEMP/ext-profile.plist"

          MAIN_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/main-profile.plist")
          EXT_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/ext-profile.plist")
          MAIN_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/main-profile.plist")
          EXT_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/ext-profile.plist")

          cp "$MAIN_PROFILE" "$PROFILE_DIR/$MAIN_UUID.mobileprovision"
          cp "$EXT_PROFILE" "$PROFILE_DIR/$EXT_UUID.mobileprovision"

          echo "MAIN_PROFILE_NAME=$MAIN_NAME" >> "$GITHUB_ENV"
          echo "EXT_PROFILE_NAME=$EXT_NAME" >> "$GITHUB_ENV"
          echo "MAIN_PROFILE_UUID=$MAIN_UUID" >> "$GITHUB_ENV"
          echo "EXT_PROFILE_UUID=$EXT_UUID" >> "$GITHUB_ENV"

      - name: Prepare Flutter iOS release files
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Configure target-specific manual signing
        env:
          MAIN_PROFILE_NAME: ${{ env.MAIN_PROFILE_NAME }}
          EXT_PROFILE_NAME: ${{ env.EXT_PROFILE_NAME }}
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          signing = {
            'Runner' => ENV.fetch('MAIN_PROFILE_NAME'),
            'extension-exampleExtension' => ENV.fetch('EXT_PROFILE_NAME')
          }

          signing.each do |target_name, profile_name|
            target = project.targets.find { |t| t.name == target_name }
            raise "Target not found: #{target_name}" unless target

            target.build_configurations.each do |config|
              next unless config.name == 'Release'
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['DEVELOPMENT_TEAM'] = '4769DGYGT3'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = profile_name
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]'] = profile_name
            end
          end

          project.save
          RUBY

      - name: Archive signed iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Fasakhansta.xcarchive" \
            archive

      - name: Export signed IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>4769DGYGT3</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.faskhaninja.clients</key>
              <string>${MAIN_PROFILE_NAME}</string>
              <key>com.faskhaninja.clients.extension-example</key>
              <string>${EXT_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Fasakhansta.xcarchive" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fasakhansta-iOS-${{ env.BUILD_NAME }}-${{ env.BUILD_NUMBER }}-signed-${{ github.sha }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Clean temporary signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/fasakhansta-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/fasakhansta_distribution.p12" \
            "$RUNNER_TEMP/main.mobileprovision" "$RUNNER_TEMP/extension.mobileprovision" \
            "$RUNNER_TEMP/main-profile.plist" "$RUNNER_TEMP/ext-profile.plist"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          if [ -n "${MAIN_PROFILE_UUID:-}" ]; then
            rm -f "$PROFILE_DIR/$MAIN_PROFILE_UUID.mobileprovision"
          fi
          if [ -n "${EXT_PROFILE_UUID:-}" ]; then
            rm -f "$PROFILE_DIR/$EXT_PROFILE_UUID.mobileprovision"
          fi
