name: Flutter code quality

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/code-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check maintained code and test formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/helpers/utils/location_service.dart
          lib/helpers/utils/address_lookup_service.dart
          lib/view/layout/map/utils/places_autocomplete_bridge_web.dart
          lib/view/layout/bottom_navigation/bottom_navigation_bar_screen.dart
          lib/view/layout/home/screen/home_screen.dart
          lib/view/layout/home/controller/home_primary_action_controller.dart
          lib/view/layout/home/widgets/home_header.dart
          lib/view/layout/home/widgets/home_feature_cards.dart
          lib/view/layout/home/widgets/home_fullscreen_content.dart
          lib/view/layout/home/widgets/home_video_background.dart
          lib/view/layout/home/widgets/go_drive_card_widget.dart
          lib/view/layout/home/widgets/restaurants_near_you_list_view_widget.dart
          lib/view/layout/orders/screen/tracking_your_order_screen.dart
          lib/view/layout/orders/controller/orders_controller.dart
          lib/view/layout/orders/widgets/live_order_tracking_hero.dart
          lib/view/layout/orders/widgets/live_order_tracking_content.dart
          lib/view/layout/orders/widgets/in_preparation_widget.dart
          lib/view/layout/restaurants/widgets/menu_product_card.dart
          lib/view/layout/home/widgets/draw_badge_chip.dart
          lib/helpers/payment/payment_navigation_policy.dart
          lib/helpers/payment/order_payment_confirmation.dart
          lib/view/custom_widgets/custom_payment_web_view/custom_payment_web_view.dart
          lib/view/custom_widgets/custom_payment_web_view/embedded_payment_browser.dart
          lib/view/layout/cart/widgets/execute_order_button.dart
          lib/view/layout/wallet/bottom_sheet/charge_wallet_bottom_sheet.dart
          test
          tool/check_places_web_callbacks.dart
      - name: Analyze maintained code
        run: >-
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
          lib/helpers/app/init_services.dart
          lib/helpers/delivery_activity/delivery_activity_push_handler.dart
          lib/helpers/delivery_activity/delivery_provider.dart
          lib/helpers/networking/api_helper.dart
          lib/helpers/notification_helper/notification_helper.dart
          lib/helpers/notification_helper/firebase_notification_helper.dart
          lib/helpers/pusher_service/pusher_controller.dart
          lib/helpers/utils/location_service.dart
          lib/helpers/utils/address_lookup_service.dart
          lib/view/layout/address/screen/map_screen.dart
          lib/view/layout/address/screen/add_address_screen.dart
          lib/view/layout/address/screen/update_address_screen.dart
          lib/view/layout/auth/controller/auth_controller.dart
          lib/view/layout/chat/controller/admin_chat_controller.dart
          lib/view/layout/map/utils/places_autocomplete_bridge_web.dart
          lib/view/layout/bottom_navigation/bottom_navigation_bar_screen.dart
          lib/view/layout/home/screen/home_screen.dart
          lib/view/layout/home/controller/home_primary_action_controller.dart
          lib/view/layout/home/widgets/home_header.dart
          lib/view/layout/home/widgets/home_feature_cards.dart
          lib/view/layout/home/widgets/home_fullscreen_content.dart
          lib/view/layout/home/widgets/home_video_background.dart
          lib/view/layout/home/widgets/go_drive_card_widget.dart
          lib/view/layout/home/widgets/restaurants_near_you_list_view_widget.dart
          lib/view/layout/orders/screen/tracking_your_order_screen.dart
          lib/view/layout/orders/controller/orders_controller.dart
          lib/view/layout/orders/widgets/live_order_tracking_hero.dart
          lib/view/layout/orders/widgets/live_order_tracking_content.dart
          lib/view/layout/orders/widgets/in_preparation_widget.dart
          lib/view/layout/restaurants/widgets/menu_product_card.dart
          lib/view/layout/home/widgets/draw_badge_chip.dart
          lib/view/layout/restaurants/screen/restaurant_details_screen.dart
          lib/helpers/payment/payment_navigation_policy.dart
          lib/helpers/payment/order_payment_confirmation.dart
          lib/view/custom_widgets/custom_payment_web_view/custom_payment_web_view.dart
          lib/view/custom_widgets/custom_payment_web_view/embedded_payment_browser.dart
          lib/view/layout/cart/widgets/execute_order_button.dart
          lib/view/layout/wallet/bottom_sheet/charge_wallet_bottom_sheet.dart
          test
          tool/check_places_web_callbacks.dart
      - name: Verify JavaScript Places callbacks
        run: |
          dart compile js --no-source-maps tool/check_places_web_callbacks.dart -o /tmp/fasakhansta-places-check.js
          node -e "globalThis.self=globalThis; require('/tmp/fasakhansta-places-check.js')"
      - name: Run regression tests
        run: flutter test --no-pub
