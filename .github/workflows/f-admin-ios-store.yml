name: GO ERP iOS store upload

on:
  push:
    branches: [codex/f-admin-ios-store-20261111]
    paths:
      - .github/workflows/f-admin-ios-store.yml
      - scripts/f-admin-ios/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-ios-publisher
  cancel-in-progress: false

env:
  DASHBOARD_REVISION: 726c5f1fc969772c0fcb95294c4724078ed3092b
  BUILD_NAME: 1.0.13
  BUILD_NUMBER: '16'

jobs:
  build-and-upload-dashboard:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the isolated publisher workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out the validated dashboard source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: omarmakramelbaz-hub/F-admin
          ref: 726c5f1fc969772c0fcb95294c4724078ed3092b
          path: dashboard
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned packaging dependencies and test signing guards
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.0 Pillow==13.0.0
          python -m unittest discover -s scripts/f-admin-ios -p 'test_*.py'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Verify Xcode and pinned dashboard source
        working-directory: dashboard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DASHBOARD_REVISION"
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 26
          python - <<'PY'
          from pathlib import Path
          source = Path('pubspec.yaml').read_text()
          assert '\nversion: 1.0.13+16\n' in '\n' + source
          project = Path('ios/Runner.xcodeproj/project.pbxproj').read_text()
          assert 'PRODUCT_BUNDLE_IDENTIFIER = com.smartvision.fasakhninga.dashboard;' in project
          PY
          python scripts/generate_app_icons.py
          flutter pub get --enforce-lockfile
          flutter build ios --config-only --release --no-codesign --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
      - name: Install CocoaPods dependencies
        working-directory: dashboard/ios
        run: pod install
      - name: Prepare the existing dashboard signing assets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: python scripts/f-admin-ios/apple_signing.py --prepare
      - name: Install the existing distribution certificate in a temporary keychain
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/f-admin-signing"
          keychain_path="$signing_dir/dashboard.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          IFS= read -r import_password < "$signing_dir/import-password"
          security import "$signing_dir/distribution.p12" -P "$import_password" -T /usr/bin/codesign -T /usr/bin/security -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          cp "$signing_dir/dashboard.mobileprovision" "$profile_dir/$DASHBOARD_PROFILE_UUID.mobileprovision"
      - name: Configure signing only for the dashboard application
        working-directory: dashboard
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          apps = project.targets.select { |t| t.product_type == 'com.apple.product-type.application' }
          raise 'Unexpected application targets' unless apps.length == 1 && apps.first.name == 'Runner'
          apps.first.build_configurations.each do |config|
            next unless config.name == 'Release'
            raise 'Unexpected bundle ID' unless config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] == 'com.smartvision.fasakhninga.dashboard'
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['DEVELOPMENT_TEAM'] = '4769DGYGT3'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('DASHBOARD_PROFILE_NAME')
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]'] = ENV.fetch('DASHBOARD_PROFILE_NAME')
          end
          project.save
          RUBY
      - name: Build the signed dashboard release
        working-directory: dashboard
        run: |
          flutter build ipa --release --no-pub --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --export-options-plist="$RUNNER_TEMP/f-admin-signing/ExportOptions.plist"
      - name: Verify the exported dashboard application
        run: python scripts/f-admin-ios/verify_export.py
      - name: Preserve the signed dashboard archive for this release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GO-ERP-iOS-1.0.13-build16
          path: dashboard/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload the dashboard build to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/f-admin-signing"
          key_dir="$signing_dir/private_keys"
          mkdir -m 700 "$key_dir"
          export API_PRIVATE_KEYS_DIR="$key_dir"
          python - <<'PY'
          import base64, os
          from pathlib import Path
          target = Path(os.environ['API_PRIVATE_KEYS_DIR']) / ('AuthKey_' + os.environ['APP_STORE_CONNECT_KEY_ID'] + '.p8')
          fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'wb') as output:
              output.write(base64.b64decode(''.join(os.environ['APP_STORE_CONNECT_API_KEY_BASE64'].split()), validate=True))
          PY
          xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Remove temporary signing material
        if: always()
        run: |
          signing_dir="$RUNNER_TEMP/f-admin-signing"
          if test -f "$signing_dir/dashboard.keychain-db"; then
            security delete-keychain "$signing_dir/dashboard.keychain-db" || true
          fi
          if test -n "${DASHBOARD_PROFILE_UUID:-}"; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$DASHBOARD_PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$signing_dir"
