name: Dashboard iOS publisher preflight

on:
  push:
    branches: [codex/f-admin-ios-store-20261111]
    paths:
      - .github/workflows/f-admin-ios-store.yml
      - scripts/f-admin-ios/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-ios-publisher
  cancel-in-progress: false

jobs:
  verify-existing-publisher:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out the isolated publisher workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the signing library
        run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Verify the existing Apple publisher without changes
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: python scripts/f-admin-ios/apple_signing.py
